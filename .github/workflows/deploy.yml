name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js for React build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. Build React app for production
      - name: Build React App
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://prhub.shop/backend/api
          VITE_WS_URL: wss://prhub.shop:8080
          VITE_APP_ENV: production

      # 5. Copy .htaccess to build folder
      - name: Copy .htaccess to Build
        run: cp frontend/.htaccess frontend/dist/.htaccess

      # 6. Deploy Frontend to Hostinger via FTP
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./frontend/dist/
          server-dir: ./
          timeout: 300000
          log-level: verbose

      # 7. Create Production .env File
      - name: Create Production .env
        run: |
          cat > backend/.env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}
          KORA_SECRET_KEY=${{ secrets.KORA_SECRET_KEY }}
          KORA_PUBLIC_KEY=${{ secrets.KORA_PUBLIC_KEY }}
          KORA_API_URL=${{ secrets.KORA_API_URL }}
          KORA_ENVIRONMENT=${{ secrets.KORA_ENVIRONMENT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          APP_URL=${{ secrets.APP_URL }}
          EOF

      # 8. Create Production config.php (CRITICAL for CORS and session handling)
      - name: Create Production config.php
        run: |
          cat > backend/config/config.php << 'CONFIGEOF'
          <?php
          /**
           * Application Configuration - Production
           * Auto-generated during deployment
           */

          // Define allowed CORS origins for production
          define('ALLOWED_ORIGINS', [
              'https://prhub.shop',
              'https://www.prhub.shop',
          ]);

          /**
           * Set CORS headers for API responses
           * 
           * This function sets the necessary headers to allow cross-origin requests
           * from approved frontend origins. It handles credentials and preflight.
           */
          function setCorsHeaders() {
              // Get the request origin
              $origin = $_SERVER['HTTP_ORIGIN'] ?? '';
              
              // Check if origin is allowed
              if (in_array($origin, ALLOWED_ORIGINS)) {
                  header("Access-Control-Allow-Origin: $origin");
                  header("Access-Control-Allow-Credentials: true");
                  header("Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS");
                  header("Access-Control-Allow-Headers: Content-Type, Authorization, X-CSRF-Token, X-Requested-With");
                  header("Access-Control-Max-Age: 86400");
              }
              
              // Handle preflight OPTIONS request
              if ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') {
                  http_response_code(204);
                  exit;
              }
          }

          // Application environment
          define('APP_ENV', 'production');
          define('DEBUG_MODE', false);
          define('FRONTEND_URL', 'https://prhub.shop');
          define('API_BASE_URL', 'https://prhub.shop/backend/api');
          ?>
          CONFIGEOF

      # 9. Deploy Backend to Hostinger via FTP
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend/
          server-dir: ./backend/
          timeout: 300000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.gitignore

      # Note: Database migrations and WebSocket restart must be done manually
      # If SSH access is needed later, add secrets: SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, SSH_PORT
            