name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js for React build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. Build React app for production
      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      # 5. Copy .htaccess to build folder
      - name: Copy .htaccess to Build
        run: cp frontend/.htaccess frontend/dist/.htaccess

      # 6. Deploy Frontend to Hostinger via FTP
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./frontend/dist/
          server-dir: ./
          timeout: 300000
          log-level: verbose

      # 7. Create Production .env File
      - name: Create Production .env
        run: |
          cat > backend/.env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}
          KORA_SECRET_KEY=${{ secrets.KORA_SECRET_KEY }}
          KORA_PUBLIC_KEY=${{ secrets.KORA_PUBLIC_KEY }}
          KORA_API_URL=${{ secrets.KORA_API_URL }}
          KORA_ENVIRONMENT=${{ secrets.KORA_ENVIRONMENT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          EOF

      # 8. Deploy Backend to Hostinger via FTP
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend/
          server-dir: ./backend/
          timeout: 300000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.gitignore
